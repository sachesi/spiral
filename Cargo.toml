[workspace]
members = ["crates/spiral", "crates/spiral-desktop"]
default-members = [".", "crates/spiral", "crates/spiral-desktop"]
resolver = "3"

[workspace.package]
version = "0.19.2"
edition = "2024"
rust-version = "1.92"
license = "GPL-3.0-or-later"
repository = "https://github.com/sachesi/spiral"

[workspace.dependencies]
spiral-core = { path = ".", version = "0.19.1" }
ashpd = { version = "0.13", default-features = false, features = ["backend", "file_chooser", "tokio"] }
async-channel = "2"
futures-util = "0.3"
tokio = { version = "1", features = ["rt"] }

[package]
name = "spiral-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "The file views, file operations, previews and file chooser of the Spiral file manager"
readme = "README.md"
include = [
    "/build.rs",
    "/src/**/*.rs",
    "/data/ui/*.blp",
    "/data/icons/**/*.svg",
    "/data/style.css",
    "/data/spiral.gresource.xml",
    "/data/io.github.sachesi.spiral.gschema.xml",
    "/LICENSE",
    "/README.md",
]

[dependencies]
gtk4 = { version = "0.11", features = ["v4_22"] }
libadwaita = { version = "0.9", features = ["v1_9"] }
gio = { version = "0.22", features = ["v2_80"] }
gio-unix = { version = "0.22", features = ["v2_66"] }
gdk4-wayland = "0.11"
gstreamer = "0.25"
gstreamer-pbutils = { version = "0.25", features = ["v1_20"] }
gstreamer-tag = "0.25"
gstreamer-video = { version = "0.25", features = ["v1_24"] }
gstreamer-allocators = { version = "0.25", features = ["v1_24"] }
kamadak-exif = "0.6"
miniz_oxide = "0.9"
ashpd.workspace = true
tokio.workspace = true
async-channel.workspace = true
async-trait = "0.1"
futures-channel = "0.3"
futures-util.workspace = true
gettext-rs = { version = "0.8", features = ["gettext-system"] }
libseccomp = "0.4"
libc = "0.2"
sourceview5 = "0.11"

[build-dependencies]
glib-build-tools = "0.22"

[profile.release]
lto = "thin"
codegen-units = 1
